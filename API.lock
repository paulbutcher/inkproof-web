theorem Inkproof.Web.Tooltip.single_eq : ∀ (fmt : Option Inkproof.Axis.NumberFormat) (showX : Bool) (traces : Array Inkproof.Web.Trace) (c : Inkproof.Web.Candidate) (t : Inkproof.Web.Trace) (x y : Float), traces[c.series]? = Option.some t → t.xs[c.point]? = Option.some x → t.ys[c.point]? = Option.some y → Inkproof.Web.Tooltip.single fmt showX traces c = Option.some ((match t.labels[c.point]? with | Option.some l => ToString.toString t.name ++ ToString.toString ", " ++ ToString.toString l | Option.none => t.name) ++ ": " ++ ", ".intercalate ((if showX = Bool.true then [Inkproof.Web.showNumber fmt x] else []) ++ [Inkproof.Web.showNumber fmt y] ++ (Option.map (Inkproof.Web.showNumber fmt) t.sizes[c.point]?).toList))
theorem Inkproof.Web.Tooltip.single_plain : ∀ (fmt : Option Inkproof.Axis.NumberFormat) (showX : Bool) (traces : Array Inkproof.Web.Trace) (c : Inkproof.Web.Candidate) (t : Inkproof.Web.Trace) (x y : Float), traces[c.series]? = Option.some t → t.xs[c.point]? = Option.some x → t.ys[c.point]? = Option.some y → t.labels[c.point]? = Option.none → t.sizes[c.point]? = Option.none → Inkproof.Web.Tooltip.single fmt showX traces c = Option.some (if showX = Bool.true then ToString.toString t.name ++ ToString.toString ": " ++ ToString.toString (Inkproof.Web.showNumber fmt x) ++ ToString.toString ", " ++ ToString.toString (Inkproof.Web.showNumber fmt y) else ToString.toString t.name ++ ToString.toString ": " ++ ToString.toString (Inkproof.Web.showNumber fmt y))
