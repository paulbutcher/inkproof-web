structure Inkproof.Web.TextCache : Type
def Inkproof.Web.TextCache.empty : Inkproof.Web.TextCache
def Inkproof.Web.TextCache.find? : Inkproof.Web.TextCache → String → String → Option (Float × Float)
theorem Inkproof.Web.TextCache.find?_empty : ∀ (font text : String), Inkproof.Web.TextCache.empty.find? font text = Option.none
theorem Inkproof.Web.TextCache.find?_insert : ∀ (c : Inkproof.Web.TextCache) (font text : String) (size : Float × Float), (c.insert font text size).find? font text = Option.some size
def Inkproof.Web.TextCache.getOrMeasure : {m : Type → Type} → [Monad m] → Inkproof.Web.TextCache → String → String → (String → String → m (Float × Float)) → m ((Float × Float) × Inkproof.Web.TextCache)
theorem Inkproof.Web.TextCache.getOrMeasure_found : ∀ {m : Type → Type} [inst : Monad m] [LawfulMonad m] (c : Inkproof.Web.TextCache) (font text : String) (measure : String → String → m (Float × Float)) {size : Float × Float}, c.find? font text = Option.some size → c.getOrMeasure font text measure = Pure.pure (size, c)
def Inkproof.Web.TextCache.insert : Inkproof.Web.TextCache → String → String → Float × Float → Inkproof.Web.TextCache
def Inkproof.Web.TextCache.measurer : Inkproof.Web.TextCache → String → String → Float × Float
theorem Inkproof.Web.TextCache.measurer_insert : ∀ (c : Inkproof.Web.TextCache) (font text : String) (size : Float × Float), (c.insert font text size).measurer font text = size
constructor Inkproof.Web.TextCache.mk : Std.HashMap (String × String) (Float × Float) → Inkproof.Web.TextCache
field Inkproof.Web.TextCache.sizes : Inkproof.Web.TextCache → Std.HashMap (String × String) (Float × Float)
def Inkproof.Web.backingPx : Nat → Inkproof.Web.Milli → Nat
theorem Inkproof.Web.backingPx_close : ∀ {css : Nat} (ratio : Inkproof.Web.Milli), 1000 ≤ css * ratio + 500 → css ≠ 0 → Inkproof.Web.backingPx css ratio * 1000 ≤ css * ratio + 500 ∧ css * ratio < Inkproof.Web.backingPx css ratio * 1000 + 500
theorem Inkproof.Web.backingPx_pos : ∀ {css : Nat}, 0 < css → ∀ (ratio : Inkproof.Web.Milli), 0 < Inkproof.Web.backingPx css ratio
theorem Inkproof.Web.backingPx_zero : ∀ (ratio : Inkproof.Web.Milli), Inkproof.Web.backingPx 0 ratio = 0
def Inkproof.Web.foldTilesM : {m : Type → Type} → [Monad m] → {M : Type} → [Inkproof.Core.Aggregate M] → (n : Nat) → 0 < n → (Nat → m (Array M)) → m Unit → Nat → Nat → m M
theorem Inkproof.Web.foldTilesM_id : ∀ {M : Type} [inst : Inkproof.Core.Aggregate M] (n : Nat) (hn : 0 < n) (tile : Nat → Array M) (lo hi : Nat), Inkproof.Web.foldTilesM n hn tile (Pure.pure ()) lo hi = Inkproof.Core.Aggregate.foldTiles n hn tile lo hi
def Inkproof.Web.formatLine : Inkproof.Web.Level → String → List (String × String) → String
theorem Inkproof.Web.formatLine_eq : ∀ (l : Inkproof.Web.Level) (m : String) (values : List (String × String)), Inkproof.Web.formatLine l m values = " ".intercalate ((ToString.toString "[inkproof " ++ ToString.toString l.name ++ ToString.toString "] " ++ ToString.toString m) :: List.map (fun x => match x with | (k, v) => ToString.toString k ++ ToString.toString "=" ++ ToString.toString v) values)
theorem Inkproof.Web.formatLine_nil : ∀ (l : Inkproof.Web.Level) (m : String), Inkproof.Web.formatLine l m [] = ToString.toString "[inkproof " ++ ToString.toString l.name ++ ToString.toString "] " ++ ToString.toString m
