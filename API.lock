theorem Inkproof.Web.SceneState.fresh_undrawn : ∀ (base generation : Nat), (Inkproof.Web.SceneState.fresh base generation).drawn = Bool.false ∧ (Inkproof.Web.SceneState.fresh base generation).cache.entries = [] ∧ (Inkproof.Web.SceneState.fresh base generation).cache.next = base
