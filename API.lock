theorem Inkproof.Web.Nav.apply_reset : ∀ (c : Inkproof.Web.NavConfig) (n : Inkproof.Web.Nav), Inkproof.Web.Nav.apply c n Inkproof.Web.Command.reset = Inkproof.Web.Nav.home c
theorem Inkproof.Web.Nav.apply_series_lt : ∀ (c : Inkproof.Web.NavConfig) (n : Inkproof.Web.Nav), n.series < c.series → ∀ (cmd : Inkproof.Web.Command), (Inkproof.Web.Nav.apply c n cmd).series < c.series
theorem Inkproof.Web.Nav.apply_view : ∀ (c : Inkproof.Web.NavConfig) (n : Inkproof.Web.Nav) (k : Inkproof.Viewport.Key), (Inkproof.Web.Nav.apply c n (Inkproof.Web.Command.view k)).view = Inkproof.Viewport.View.step c.view n.view (Inkproof.Viewport.Input.key k)
