theorem Inkproof.Web.Size.needsResize_iff : ∀ (current : Inkproof.Web.Size) (w h : Nat) (ratio : Inkproof.Web.Milli), current.needsResize w h ratio = Bool.true ↔ current ≠ Inkproof.Web.Size.backing w h ratio
