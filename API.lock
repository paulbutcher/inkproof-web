def Inkproof.Web.TextCache.getOrMeasure : {m : Type → Type} → [Monad m] → Inkproof.Web.TextCache → String → String → (String → String → m (Float × Float)) → m ((Float × Float) × Inkproof.Web.TextCache)
theorem Inkproof.Web.TextCache.getOrMeasure_found : ∀ {m : Type → Type} [inst : Monad m] [LawfulMonad m] (c : Inkproof.Web.TextCache) (font text : String) (measure : String → String → m (Float × Float)) {size : Float × Float}, c.find? font text = Option.some size → c.getOrMeasure font text measure = Pure.pure (size, c)
