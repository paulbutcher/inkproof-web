theorem Inkproof.Web.Trace.onScreen_ys : ∀ (config : Inkproof.Viewport.ViewConfig Float) (view : Inkproof.Viewport.View Float) (t : Inkproof.Web.Trace), (Inkproof.Web.Trace.onScreen config view t).ys = Array.map (fun y => config.y.length - Inkproof.Viewport.Interval.toScreen config.y view.y y) t.ys
