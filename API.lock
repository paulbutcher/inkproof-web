def Inkproof.Web.Level.ofNat : Nat → Inkproof.Web.Level
theorem Inkproof.Web.Level.ofNat_ctorIdx : ∀ (x : Inkproof.Web.Level), Inkproof.Web.Level.ofNat x.ctorIdx = x
