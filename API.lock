theorem Inkproof.Web.Nav.input_eq : ∀ (c : Inkproof.Web.NavConfig) (n : Inkproof.Web.Nav) (i : Inkproof.Viewport.Input Float), Inkproof.Web.Nav.input c n i = { view := Inkproof.Viewport.View.step c.view n.view i, point := n.point, series := n.series }
theorem Inkproof.Web.Nav.input_key : ∀ (c : Inkproof.Web.NavConfig) (n : Inkproof.Web.Nav) (k : Inkproof.Viewport.Key), Inkproof.Web.Nav.input c n (Inkproof.Viewport.Input.key k) = Inkproof.Web.Nav.apply c n (Inkproof.Web.Command.view k)
