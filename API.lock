theorem Inkproof.Web.Nearest.find_least : ∀ (metric : Inkproof.Web.Metric) (traces : Array Inkproof.Web.Trace) (cx cy : Float), (∀ (c : Inkproof.Web.Candidate), Inkproof.Float.Float.IsOrdered (metric.dist cx cy c)) → ∀ (r : Inkproof.Web.Candidate), Inkproof.Web.Nearest.find metric traces cx cy = Option.some r → r ∈ Inkproof.Web.Nearest.candidates traces ∧ ∀ (c : Inkproof.Web.Candidate), c ∈ Inkproof.Web.Nearest.candidates traces → metric.dist cx cy r ≤ metric.dist cx cy c
