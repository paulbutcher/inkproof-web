theorem Inkproof.Web.Tooltip.parse_off : Inkproof.Web.Tooltip.parse (Option.some "off") = Except.ok Option.none
theorem Inkproof.Web.Tooltip.parse_some : ∀ (s : String), Inkproof.Web.Tooltip.parse (Option.some s) = if s = "off" then Except.ok Option.none else match (List.foldlM Inkproof.Web.Tooltip.choose✝ { } (Inkproof.Web.Legend.words s)).bind Inkproof.Web.Tooltip.finish✝ with | Option.some style => Except.ok (Option.some style) | Option.none => Except.error (ToString.toString "attribute tooltip is \"" ++ ToString.toString s ++ ToString.toString "\", expected " ++ ToString.toString Inkproof.Web.Tooltip.forms✝)
def Inkproof.Web.Tooltip.sharedText : Option Inkproof.Axis.NumberFormat → Bool → Array Inkproof.Web.Trace → Float → Option String
theorem Inkproof.Web.Tooltip.sharedText_eq : ∀ (fmt : Option Inkproof.Axis.NumberFormat) (showX : Bool) (traces : Array Inkproof.Web.Trace) (x : Float), (Array.filter (fun x => !x.hidden) (Inkproof.Web.Legend.rows traces (Option.some x))).isEmpty = Bool.false → Inkproof.Web.Tooltip.sharedText fmt showX traces x = Option.some ("\n".intercalate ((if showX = Bool.true then [ToString.toString "x: " ++ ToString.toString (Inkproof.Web.showNumber fmt x)] else []) ++ (Array.map (Inkproof.Web.Legend.text fmt) (Array.filter (fun x => !x.hidden) (Inkproof.Web.Legend.rows traces (Option.some x)))).toList))
theorem Inkproof.Web.Tooltip.sharedText_none_of_hidden : ∀ (fmt : Option Inkproof.Axis.NumberFormat) (showX : Bool) (traces : Array Inkproof.Web.Trace) (x : Float), (∀ (t : Inkproof.Web.Trace), t ∈ traces → t.hidden = Bool.true) → Inkproof.Web.Tooltip.sharedText fmt showX traces x = Option.none
