theorem Inkproof.Web.Nearest.argmin_least : ∀ (d : Inkproof.Web.Candidate → Float), (∀ (c : Inkproof.Web.Candidate), Inkproof.Float.Float.IsOrdered (d c)) → ∀ (cs : List Inkproof.Web.Candidate) (r : Inkproof.Web.Candidate), Inkproof.Web.Nearest.argmin d cs = Option.some r → ∀ (c : Inkproof.Web.Candidate), c ∈ cs → d r ≤ d c
theorem Inkproof.Web.Nearest.argmin_mem : ∀ (d : Inkproof.Web.Candidate → Float), (∀ (c : Inkproof.Web.Candidate), Inkproof.Float.Float.IsOrdered (d c)) → ∀ (cs : List Inkproof.Web.Candidate) (r : Inkproof.Web.Candidate), Inkproof.Web.Nearest.argmin d cs = Option.some r → r ∈ cs
def Inkproof.Web.Nearest.candidates : Array Inkproof.Web.Trace → List Inkproof.Web.Candidate
def Inkproof.Web.Nearest.find : Inkproof.Web.Metric → Array Inkproof.Web.Trace → Float → Float → Option Inkproof.Web.Candidate
theorem Inkproof.Web.Nearest.find_least : ∀ (metric : Inkproof.Web.Metric) (traces : Array Inkproof.Web.Trace) (cx cy : Float), (∀ (c : Inkproof.Web.Candidate), Inkproof.Float.Float.IsOrdered (metric.dist cx cy c)) → ∀ (r : Inkproof.Web.Candidate), Inkproof.Web.Nearest.find metric traces cx cy = Option.some r → r ∈ Inkproof.Web.Nearest.candidates traces ∧ ∀ (c : Inkproof.Web.Candidate), c ∈ Inkproof.Web.Nearest.candidates traces → metric.dist cx cy r ≤ metric.dist cx cy c
theorem Inkproof.Web.Nearest.find_none_iff : ∀ (metric : Inkproof.Web.Metric) (traces : Array Inkproof.Web.Trace) (cx cy : Float), Inkproof.Web.Nearest.find metric traces cx cy = Option.none ↔ Inkproof.Web.Nearest.candidates traces = []
theorem Inkproof.Web.Nearest.mem_candidates : ∀ (traces : Array Inkproof.Web.Trace) (c : Inkproof.Web.Candidate), c ∈ Inkproof.Web.Nearest.candidates traces ↔ ∃ t, traces[c.series]? = Option.some t ∧ t.hidden = Bool.false ∧ t.xs[c.point]? = Option.some c.x ∧ t.ys[c.point]? = Option.some c.y ∧ c.x.isNaN = Bool.false ∧ c.y.isNaN = Bool.false
