theorem Inkproof.Web.showFloat_eq : ∀ (f : Float), Inkproof.Web.showFloat f = if (ToString.toString f).contains '.' = Bool.true then (((ToString.toString f).dropEndWhile fun x => x == '0').dropEndWhile fun x => x == '.').toString else ToString.toString f
