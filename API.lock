theorem Inkproof.Web.Trace.valueAt_eq : ∀ (t : Inkproof.Web.Trace) (x : Float), t.valueAt x = Option.map (fun x => x.y) (Inkproof.Web.Nearest.find Inkproof.Web.Metric.x #[{ name := t.name, color := t.color, xs := t.xs, ys := t.ys }] x 0)
theorem Inkproof.Web.Trace.valueAt_none_iff : ∀ (t : Inkproof.Web.Trace) (x : Float), t.valueAt x = Option.none ↔ Inkproof.Web.Nearest.candidates #[{ name := t.name, color := t.color, xs := t.xs, ys := t.ys }] = []
