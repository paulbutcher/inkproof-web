theorem Inkproof.Web.Select.config_domain : ∀ (c : Inkproof.Viewport.ViewConfig Float), (Inkproof.Web.Select.config c).domain = (Inkproof.Viewport.View.home c).x
theorem Inkproof.Web.Select.config_minWidth : ∀ (c : Inkproof.Viewport.ViewConfig Float), (Inkproof.Web.Select.config c).minWidth = Inkproof.Web.Select.minPixels * ((Inkproof.Viewport.View.home c).x.span / c.x.length)
theorem Inkproof.Web.Select.config_tolerance : ∀ (c : Inkproof.Viewport.ViewConfig Float), (Inkproof.Web.Select.config c).tolerance = Inkproof.Web.Select.grabPixels * ((Inkproof.Viewport.View.home c).x.span / c.x.length)
