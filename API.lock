theorem Inkproof.Web.Select.following_eq : ∀ (c : Inkproof.Viewport.ViewConfig Float) (view : Inkproof.Viewport.View Float), Inkproof.Web.Select.following c view = Inkproof.Viewport.Selection.draw (Inkproof.Web.Select.config c) view.x.start (view.x.start + view.x.span)
